services:
  postgres:
    image: postgres:16-alpine
    container_name: funpay_bot_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${db_name:-funpay_bot}
      POSTGRES_USER: ${db_username:-postgres}
      POSTGRES_PASSWORD: ${db_password:-postgres}
    ports:
      - "127.0.0.1:5437:5432"   # доступ к БД только с самого сервера (не наружу)
    volumes:
      - funpay_bot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${db_username:-postgres} -d ${db_name:-funpay_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: funpay_bot
    restart: unless-stopped
    # Сеть хоста: нужна для доступа к Telegram по IPv6 (у хостера IPv4 к
    # api.telegram.org заблокирован, а IPv6 работает). FunPay/Steam идут по IPv4.
    # При host-сети БД берётся по db_host/db_port из .env (localhost:5437 —
    # postgres опубликован на 127.0.0.1:5437), сервисное имя compose недоступно.
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./logs:/app/logs   # ротация логов видна на хосте (log_file=logs/bot.log)

volumes:
  funpay_bot_pgdata:
